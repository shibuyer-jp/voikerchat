name: API TypeCheck

# api/ 配下の TypeScript のみを対象とする軽量ジョブ。Flutterのセットアップは
# 不要なため高速に回る(Flutter CI: flutter-ci.yml / ci-cd.yml とは分離)。
on:
  push:
  pull_request:

jobs:
  typecheck:
    name: tsc --noEmit (api/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck
