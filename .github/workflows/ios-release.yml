name: iOS Release (Archive & Upload to App Store Connect)

# 手動トリガーのみ。App Store Connect への実アップロードを伴うため
# push/PR での自動実行はしない。
#
# ローカル(Intel Mac, Xcode 16)では iOS 26 SDK 要件を満たせず
# App Store Connect へのアップロードが不可能なため、Xcode 26 が
# プリインストール済みの macos-26 ランナー上でアーカイブ〜アップロードまで行う。
# 署名は App Store Connect API キー方式(-allowProvisioningUpdates)で
# ヘッドレスに解決するため、証明書/プロビジョニングプロファイルの
# 事前準備は不要。
on:
  workflow_dispatch:

jobs:
  archive-and-upload:
    name: Archive & Upload
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Select Xcode 26.3
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      # 署名なしでネイティブビルド前提の Flutter 成果物(App.framework 等)を生成。
      # 実際の署名付きアーカイブは後続の xcodebuild archive で行う。
      - name: Flutter build (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            --dart-define=REVENUECAT_IOS_KEY="${{ secrets.REVENUECAT_IOS_KEY }}"

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # App Manager 権限の ASC API キーではクラウド管理署名
      # (cloud-managed distribution certificate) が使えないため、
      # ASC API で発行済みの Apple Distribution 証明書(6M2X4S28G7)を
      # p12 として一時キーチェーンに取り込み、通常の自動署名で解決する。
      # プロビジョニングプロファイルの生成/取得は引き続き
      # -allowProvisioningUpdates + API キーが担う。
      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Apple WWDR G3 中間証明書(発行チェーン用)
          curl -sSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true

          printf '%s' "$IOS_DIST_CERT_P12" | base64 -d > "$RUNNER_TEMP/dist_cert.p12"
          security import "$RUNNER_TEMP/dist_cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null

          echo "== signing identities =="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # App Store 用プロビジョニングプロファイル(W8XH2M23DC,
      # "voikerchat App Store 2026")を ASC API で作成済み。
      # Export は ExportOptions.plist の manual 署名でこのプロファイルを使う。
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "installed profile UUID: $UUID"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: ios
        run: |
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        working-directory: ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA_PATH=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          xcrun altool --upload-app --type ios \
            -f "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload archive as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcarchive
          path: ${{ runner.temp }}/Runner.xcarchive
          if-no-files-found: ignore
