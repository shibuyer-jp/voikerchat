# Flutter gen-l10n 設定。
# ARB ファイルから AppLocalizations を生成する。
# lib/l10n に実ファイルとして出力する
# （import は package:voikerchat/l10n/app_localizations.dart）。
# 注: 旧 synthetic-package キーは非推奨のため削除済み(2026-07-10)。
arb-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/l10n
nullable-getter: false
